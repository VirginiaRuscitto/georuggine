[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rumqttc = "0.24"
tokio = { version = "1", features = ["full"] }
axum = "0.8.9"